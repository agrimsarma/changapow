<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Changa Pow</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <div class="board-col">
      <div class="titleblock">
        <div class="title">Changa Pow</div>
        <div class="subtitle">Cross-track board game — 4 players, wooden-stick roll</div>
      </div>
      <div class="board" id="board"></div>
    </div>

    <div class="sidebar">
      <div class="card">
        <div class="card-title">Turn</div>
        <div id="turnIndicator" class="turn-indicator"></div>
        <button id="rollBtn" class="roll-btn">Toss sticks</button>
        <div id="rollResult" class="roll-result"></div>
      </div>

      <div class="card">
        <div class="card-title">Players</div>
        <div id="playersList" class="players-list"></div>
      </div>

      <div class="card">
        <div class="card-title">Stick roll</div>
        <div class="card-sub">4 half-cylinder sticks, tossed each turn.</div>
        <div class="sticks-demo">
          <div class="stick-demo">
            <div class="stick"></div>
            <div class="stick-label">flat side up</div>
          </div>
          <div class="stick-demo">
            <div class="stick stick-round"></div>
            <div class="stick-label">round side up</div>
          </div>
        </div>
        <div class="score-table">
          <div class="score-row"><span>0 sticks flat</span><span class="score">4</span></div>
          <div class="score-row"><span>1 stick flat</span><span class="score">3</span></div>
          <div class="score-row"><span>2 sticks flat</span><span class="score">2</span></div>
          <div class="score-row"><span>3 sticks flat</span><span class="score">1</span></div>
          <div class="score-row"><span>4 sticks flat</span><span class="score">8 (extra turn)</span></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Log</div>
        <div id="log" class="log"></div>
      </div>
    </div>
  </div>

  <div id="winOverlay" class="win-overlay hidden">
    <div class="win-card">
      <div id="winText"></div>
      <button id="newGameBtn" class="roll-btn">New game</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
